[output]
dir = "./showcase"

# ── Template previews (page 1 of each generated PDF) ──

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-html.pdf"
name = "modern-html"
viewport = { width = 1200, height = 1130 }
full_page = false
formats = [{ output_type = "png" }]

[[scenes]]
type = "web"
uri = "showcase/pdfs/modern-latex.pdf"
name = "modern-latex"
viewport = { width = 1200, height = 1130 }
full_page = false
formats = [{ output_type = "png" }]

[[scenes]]
