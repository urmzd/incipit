# ── Terminal demo ──

[[scenes]]
type = "terminal"
name = "demo-cli"
theme = "dracula"
cols = 110
rows = 5
formats = [{ output_type = "gif" }, { output_type = "png" }]
frame_duration = 80

[[scenes.interactions]]
type = "type"
text = "export PATH=/private/tmp/claude-501/-Users-urmzd-github/3f9bd60f-c0ec-4c85-8d5d-434305c269eb/scratchpad/bin:$PATH"
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 300
hidden = true

[[scenes.interactions]]
type = "type"
text = "export PS1='$ ' && clear"
hidden = true

[[scenes.interactions]]
type = "key"
key = "enter"
hidden = true

[[scenes.interactions]]
type = "wait"
duration = 300
hidden = true

[[scenes.interactions]]
type = "type"
text = "incipit generate assets/example_resumes/software_engineer.json -t modern-html -o outputs 2>/dev/null | jq -r '.results[].path | sub(\".*/outputs/\"; \"\")'"
speed = 30

[[scenes.interactions]]
type = "key"
key = "enter"

[[scenes.interactions]]
type = "wait"
duration = 8000
